services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lostoken
      POSTGRES_USER: lostoken
      POSTGRES_PASSWORD: lostoken
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostoken -d lostoken"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      DATABASE_URL: postgres://lostoken:lostoken@postgres:5432/lostoken
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      BIND_ADDR: 0.0.0.0:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SESSION_SECRET: ${SESSION_SECRET:?请在.env中设置SESSION_SECRET}
      KEY_HASH_PEPPER: ${KEY_HASH_PEPPER:?请在.env中设置KEY_HASH_PEPPER}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?请在.env中设置CREDENTIAL_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在.env中设置ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres_data: